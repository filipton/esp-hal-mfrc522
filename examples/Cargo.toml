[package]
name = "example"
version = "0.1.0"
edition = "2021"

[dependencies]
embassy-executor = "0.10.0"
embassy-time = "0.5.1"
esp-backtrace = { version = "0.20.0", features = [
    "panic-handler",
    "println",
] }
esp-hal = { version = "1.2.2", features = ["unstable"] }
esp-rtos = { version = "0.4.0", features = ["embassy"] }
esp-bootloader-esp-idf = "0.6.0"
esp-println = { version = "0.18.0", features = ["log-04"] }
heapless = "0.9.3"
log = { version = "0.4.34" }
static_cell = { version = "2.1.1", features = ["nightly"] }
esp-hal-mfrc522 = { path = "../", features = ["embassy-time"] }
#adv-shift-registers = { path = "../../adv-shift-registers" }
embedded-hal = "1.0.0"
adv-shift-registers = "0.2.5"
embedded-hal-bus = { version = "0.3.0", features = ["async"] }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false

[features]
default = ["esp32s3"]
esp32s3 = ["esp-backtrace/esp32s3", "esp-hal/esp32s3", "esp-rtos/esp32s3", "esp-bootloader-esp-idf/esp32s3", "esp-println/esp32s3"]
esp32c3 = ["esp-backtrace/esp32c3", "esp-hal/esp32c3", "esp-rtos/esp32c3", "esp-bootloader-esp-idf/esp32c3", "esp-println/esp32c3"]
