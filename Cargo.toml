[package]
name = "esp-hal-mfrc522"
version = "0.4.0"
authors = ["filipton <filipton12@gmail.com>"]
edition = "2024"
license = "MIT"
description = "Async, no_std, allocation-free MFRC522 RFID driver for esp-hal (any embedded-hal-async SPI or I2C bus)"
repository = "https://github.com/filipton/esp-hal-mfrc522"
# examples/ is a standalone firmware crate, not cargo examples
autoexamples = false

[lib]

[dependencies]
embedded-hal-async = "1.0.0"
heapless = "0.9.3"
log = { version = "0.4.34" }
embassy-time = { version = "0.5.1", optional = true }

[features]
default = []
embassy-time = ["dep:embassy-time"]
