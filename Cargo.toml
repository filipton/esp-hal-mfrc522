[package]
name = "esp-hal-mfrc522"
version = "0.3.4"
authors = ["filipton <filipton12@gmail.com>"]
edition = "2024"
license = "MIT"
description = "Simple mfrc522 library for esp-hal (can be used on any hal that implements embedded-hal-async)"
repository = "https://github.com/filipton/esp-hal-mfrc522"

[lib]

[dependencies]
embedded-hal-async = "1.0.0"
heapless = "0.9.3"
log = { version = "0.4.34" }
embassy-time = { version = "0.5.1", optional = true }

[features]
default = []
embassy-time = ["dep:embassy-time"]
